# Merge to main: checks, then staging, then production — each stage migrates
# its database, deploys, smoke-tests, and rolls back to its deployed/<stage>
# tag if the smoke test fails. Production runs only after staging passed.
# A manual run can deploy staging alone, or both.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: How far to deploy
        type: choice
        options: [staging, production]
        default: production

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: checks
    uses: ./.github/workflows/deploy-stage.yml
    permissions:
      id-token: write
      contents: write
    with:
      stage: staging
      environment: aws-staging

  production:
    needs: staging
    if: github.event_name == 'push' || inputs.stage == 'production'
    uses: ./.github/workflows/deploy-stage.yml
    permissions:
      id-token: write
      contents: write
    with:
      stage: production
      environment: aws-production
